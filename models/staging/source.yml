version: 2

sources:
  - name: airbnb
    schema: raw
    tables:
     - name: listings
       identifier: listings
       columns:
         - name: id
           tests:
              - unique
              - not_null       

         - name: room_type
           tests:
             - dbt_expectations.expect_column_distinct_count_to_equal:
                 value: 4

     - name: hosts
       identifier: hosts
 
     - name: reviews
       identifier: reviews

     - name: customer
       identifier: customer

     - name: source_freshness_table
       identifier: source_freshness_table
       loaded_at_field: created_at
       freshness:
           warn_after:
             count: 5
             period: minute
           error_after:
             count: 7
             period: minute       